  <line x1="540" y1="427" x2="620" y2="427" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="36" y="486" font-size="12" fill="#334155">Подключение: в каждом workflow Settings → Error Workflow = «Ошибки: уведомление администратора».</text>
