<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ref" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1100" height="980" fill="#FFFFFF"/>
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#0F172A">Как соединены ноды в workflow</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#475569">Имена нод такие же, как в импортируемых JSON-файлах</text>
  <rect x="20" y="70" width="1060" height="260" rx="10" fill="#FAFAFA" stroke="#CBD5E1"/>
  <text x="36" y="92" font-size="15" font-weight="bold" fill="#0F172A">A. Чат-бот: chat-bot-workflow.json</text>
