  <text x="160.0" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Error Trigger</text>
  <text x="160.0" y="438" text-anchor="middle" font-size="11" fill="#334155">ошибка в любом workflow</text>
  <rect x="340" y="400" width="200" height="54" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
