  <text x="185.0" y="278" text-anchor="middle" font-size="11" fill="#334155">ai_languageModel</text>
  <rect x="300" y="240" width="170" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="385.0" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Window Buffer Memory</text>
  <text x="385.0" y="278" text-anchor="middle" font-size="11" fill="#334155">ai_memory</text>
  <rect x="500" y="240" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="585.0" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Google Calendar</text>
  <text x="585.0" y="278" text-anchor="middle" font-size="11" fill="#334155">ai_tool (план)</text>
  <rect x="700" y="240" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="785.0" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Google Sheets</text>
  <text x="785.0" y="278" text-anchor="middle" font-size="11" fill="#334155">ai_tool (план)</text>
  <line x1="185" y1="240" x2="440" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
