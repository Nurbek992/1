  <text x="150.0" y="168" text-anchor="middle" font-size="11" fill="#334155">вход из чата n8n</text>
  <rect x="340" y="130" width="200" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="440.0" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">AI Agent</text>
  <text x="440.0" y="168" text-anchor="middle" font-size="11" fill="#334155">Claude, системный промпт</text>
