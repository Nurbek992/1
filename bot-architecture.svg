  <text x="755.0" y="608" text-anchor="middle" font-size="11" fill="#334155">Code: нет в таблице</text>
  <rect x="880" y="570" width="170" height="54" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="965.0" y="592" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Append to Sheet</text>
